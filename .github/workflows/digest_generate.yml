name: ESG Digest — Generate (7:30 PM IST)

on:
  schedule:
    # 7:30 PM IST = 14:00 UTC
    - cron: '0 14 * * *'
  workflow_dispatch:

jobs:
  generate-digest:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - name: Trigger Digest Generation
        run: |
          response=$(curl -s -w "\n%{http_code}" -X POST \
            "${{ secrets.RAILWAY_BACKEND_URL }}/api/run-digest?phase=generate" \
            -H "X-Pipeline-Secret: ${{ secrets.PIPELINE_SECRET }}" \
            -H "Content-Type: application/json")
          
          http_code=$(echo "$response" | tail -n1)
          body=$(echo "$response" | head -n-1)
          
          echo "Response: $body"
          echo "HTTP Status: $http_code"
          
          if [ "$http_code" -ne 200 ]; then
            echo "Digest generation trigger failed with status $http_code"
            exit 1
          fi
          
          echo "Digest generation triggered at $(date -u '+%Y-%m-%d %H:%M UTC') (7:30 PM IST)"
