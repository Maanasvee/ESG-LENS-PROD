# ============================================================
# ESG Lens — Central Runtime Configuration
# All source configs, prompt templates, urgency alert thresholds,
# and cron schedules are defined here.
# No code rewrite required to add a source or change a prompt.
# ============================================================

app:
  name: "ESG Lens by Bevolve.ai"
  version: "1.0.0"
  environment: production  # development | production

# ──────────────────────────────────────────────────────────────
# LLM Configuration
# ──────────────────────────────────────────────────────────────
llm:
  primary: "gemini-2.0-flash"
  fallback: "llama-3.3-70b-versatile"  # Groq model name
  embedding_model: "models/text-embedding-004"
  max_retries: 3
  timeout_seconds: 30

  classification_prompt: |
    You are an expert ESG regulatory analyst. Classify the following document 
    and return ONLY valid JSON with no preamble, no markdown, no explanation.

    Rules:
    - pillar must be exactly one of: E, S, G
    - status must be exactly one of: Proposed, Consultation, Enacted, Amended
    - urgency must be exactly one of: Low, Medium, High, Critical
    - jurisdiction should be the primary geography (e.g., India, EU, US, UK, Global)
    - sectors must be a list chosen from: Energy, Finance, Manufacturing, Real Estate, FMCG, 
      Technology, Healthcare, Infrastructure, Agriculture, Aviation, Shipping, Chemicals
    - summary must be exactly 3 plain-English sentences written for a Chief Sustainability Officer 
      audience. Focus on: what changed, why it matters, what action is needed.
    - date format: YYYY-MM-DD

    Document title: {title}
    Source: {source}
    Published date: {date}
    Content: {content}

    Return JSON:
    {
      "title": "cleaned and concise policy title",
      "source": "source organisation name",
      "date": "YYYY-MM-DD",
      "jurisdiction": "primary geography",
      "pillar": "E|S|G",
      "sectors": ["list", "of", "sectors"],
      "status": "Proposed|Consultation|Enacted|Amended",
      "urgency": "Low|Medium|High|Critical",
      "summary": "3 sentences for CSO audience."
    }

  digest_prompt: |
    You are a sustainability intelligence analyst writing a personalised daily brief 
    for a Chief Sustainability Officer working in the {sectors} sector(s) with 
    operations in {jurisdictions}.

    Below are today's verified ESG policy updates relevant to this user.
    Write a concise, professional brief structured as:
    1. HEADLINE: One compelling sentence summarising the most important development
    2. WHAT CHANGED: 2-3 sentences on the specific regulatory changes
    3. WHY IT MATTERS: 2-3 sentences on business and sector implications
    4. REQUIRED ACTION: 1-2 sentences on immediate steps (if any)

    Policies:
    {policies}

    Return the brief in plain text, not JSON.

# ──────────────────────────────────────────────────────────────
# Scraping Configuration
# ──────────────────────────────────────────────────────────────
scraping:
  rss_poll_interval_minutes: 30
  playwright_timeout_ms: 30000
  playwright_max_concurrent: 3      # max concurrent Playwright pages
  playwright_ram_guard_mb: 350      # skip Playwright if RSS RAM > this
  max_raw_text_chars: 50000         # truncate raw text before LLM
  user_agent: "ESGLens/1.0 (+https://bevolve.ai/eslens)"

