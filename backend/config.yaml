# ──────────────────────────────────────────────────────────────
# Alert Thresholds
# ──────────────────────────────────────────────────────────────
alerts:
  # FCM push sent IMMEDIATELY to matching users only if ALL conditions met:
  immediate_trigger_statuses:
    - Enacted
  immediate_trigger_urgencies:
    - High
    - Critical
  # All other verified policies are queued for digest only

# ──────────────────────────────────────────────────────────────
# Digest Schedule (also enforced via GitHub Actions cron)
# ──────────────────────────────────────────────────────────────
digest:
  generate_cron: "30 14 * * *"   # 7:30 PM IST = 14:00 UTC
  dispatch_cron: "30 2 * * *"    # 8:00 AM IST = 02:30 UTC
  lookback_hours: 24

# ──────────────────────────────────────────────────────────────
# Default Taxonomy (used for settings UI pre-population)
# ──────────────────────────────────────────────────────────────
taxonomy:
  sectors:
    - Energy
    - Finance
    - Manufacturing
    - Real Estate
    - FMCG
    - Technology
    - Healthcare
    - Infrastructure
    - Agriculture
    - Aviation
    - Shipping
    - Chemicals

  jurisdictions:
    - India
    - EU
    - US
    - UK
    - Global
    - APAC
    - UN

# ──────────────────────────────────────────────────────────────
# Policy Alias Map (bootstrapped — editable at runtime via DB)
# ──────────────────────────────────────────────────────────────
policy_aliases:
  - alias: "CSRD"
    master: "Corporate Sustainability Reporting Directive"
  - alias: "BRSR"
    master: "Business Responsibility and Sustainability Report"
  - alias: "EU Taxonomy"
    master: "EU Taxonomy for Sustainable Activities"
  - alias: "TCFD"
    master: "Task Force on Climate-related Financial Disclosures"
  - alias: "SFDR"
    master: "Sustainable Finance Disclosure Regulation"
  - alias: "PAT Scheme"
    master: "Perform Achieve and Trade Scheme"
  - alias: "CBAM"
    master: "Carbon Border Adjustment Mechanism"
  - alias: "CCTS"
    master: "Carbon Credit Trading Scheme India"
